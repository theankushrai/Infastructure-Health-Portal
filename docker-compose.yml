version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: infra-health-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: infra-health-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: infra-health-worker
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: infra-health-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
