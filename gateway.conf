server {
    listen 80;

    # Route API calls to the backend service
    location /api/ {
        proxy_pass http://infra-health-backend:8000/api/;
        proxy_set_header Host $host;
    }

    # Route everything else to the frontend service
    location / {
        proxy_pass http://infra-health-frontend:80/;
        proxy_set_header Host $host;
    }
}